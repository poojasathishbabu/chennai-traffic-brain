services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports: ['9092:9092']
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ['8123:8123','9000:9000']
  redis:
    image: redis:7.2-alpine
    ports: ['6379:6379']
  api:
    build: .
    ports: ['8000:8000']
    command: uvicorn src-api-main:app --host 0.0.0.0 --port 8000
